[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-sdr-server"
version = "0.1.0"
description = "Backend local de espectro RF (WebSocket) para RF Monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "numpy>=1.26.0,<2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
rf-sdr-server = "sdr_server.main:run"

[tool.setuptools.packages.find]
include = ["sdr_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
